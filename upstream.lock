# Third-party skills, pinned by commit. install.sh clones each repo at the
# pinned SHA and links the listed skill directories into both harnesses.
# Bump a pin by editing the SHA, reading the upstream diff, then re-running
# ./install.sh.
#
# repo  <name>  <url>  <sha>
# skill <repo-name>  <path-in-repo>

